	<desc >#direction: down
	#spacing: 45
	#gutter: 25
	#edgeMargin: 6
	#fontSize: 13
	#lineWidth: 1.2
	#bendSize: 0.3
	
	[Quadra|
	-id: String;
	-nome: String;
	-modalidadesPermitidas: Set~Modalidade~;
	-ativa: boolean
	|
	+getId(): String;
	+getNome(): String;
	+aceitaModalidade(modalidade: Modalidade): boolean;
	+ativar(): void;
	+desativar(): void;
	+isAtiva(): boolean;
	+getModalidadesPermitidas(): Set~Modalidade~;
	+equals(o: Object): boolean;
	+hashCode(): int
	]
	
	[Participante|
	-idParticipante: String;
	-nome: String
	|
	+getID(): String;
	+getNome(): String;
	+equals(o: Object): boolean;
	+hashCode(): int
	]
	
	[&lt;valueObject&gt; PeriodoReserva|
	+inicio: LocalDateTime;
	+fim: LocalDateTime
	|
	+sobrepoe(outro: PeriodoReserva): boolean
	]
	
	[Reserva|
	-idReserva: String;
	-participante: Participante;
	-quadra: Quadra;
	-periodoReserva: PeriodoReserva;
	-modalidade: Modalidade;
	-statusReserva: StatusReserva
	|
	+getId(): String;
	+getParticipante(): Participante;
	+getQuadra(): Quadra;
	+getPeriodoReserva(): PeriodoReserva;
	+getModalidade(): Modalidade;
	+getStatusReserva(): StatusReserva;
	+equals(o: Object): boolean;
	+hashCode(): int
	]
	
	[&lt;enumeration&gt; Modalidade|
	FUTSAL;
	VOLEIBOL;
	BASQUETE;
	TENIS;
	HANDEBOL;
	SOCIETY
	]
	
	[&lt;enumeration&gt; StatusReserva|
	CONFIRMADA;
	CANCELADA;
	CONCLUIDA
	]
	
	[Reserva] o-&gt; [Quadra]
	[Reserva] o-&gt; [Participante]
	[Reserva] +-&gt; [PeriodoReserva]
	[Reserva] -&gt; [Modalidade]
	[Reserva] -&gt; [StatusReserva]
	[Quadra] -&gt; [Modalidade]
	</desc>
